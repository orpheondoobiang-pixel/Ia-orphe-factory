plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orphe.factory'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orphe.factory'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-demo'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

dependencies {
    // Intentionally dependency-free: the demo uses standard Android Views.
}
